services:
  postgres:
    container_name: condors-postgres
    image: postgres:16.5-alpine3.20
    environment:
      - POSTGRES_USER=pg
      - POSTGRES_PASSWORD=pw
      - POSTGRES_DB=db
    ports:
      - "5211:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg -d db"]
      interval: 1s
      timeout: 3s
      retries: 30

  garage:
    container_name: condors-garage
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=GKdevaccesskey
      - GARAGE_DEFAULT_SECRET_KEY=devsecretkeydevsecretkey
      - GARAGE_DEFAULT_BUCKET=default
    volumes:
      - ./dev/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "5212:3900"
    restart: always
    healthcheck:
      test: ["CMD", "/garage", "stats", "-a"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  garage-meta:
  garage-data:
